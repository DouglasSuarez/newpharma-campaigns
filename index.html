<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>NewPharma</title><script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f7fa;padding:20px}.login{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#0f67b1,#1e88e5);display:flex;justify-content:center;align-items:center;z-index:999}.login.hide{display:none}.login-box{background:white;padding:40px;border-radius:15px;max-width:400px;box-shadow:0 10px 40px rgba(0,0,0,.2)}.login-box h1{font-size:28px;color:#0f67b1;margin-bottom:20px}.app{max-width:1200px;margin:0 auto}.app.hide{display:none}.header{background:white;padding:20px;border-radius:10px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin:30px 0}.day{border:1px solid #e0e0e0;border-radius:8px;padding:10px;min-height:80px;background:white;text-align:center}.day.active{border:2px solid #0f67b1;background:#f0f7ff}.campaigns{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px;margin-top:30px}.campaign{background:#f9f9f9;border-left:4px solid #0f67b1;padding:15px;border-radius:8px}input,select,button{padding:10px;border:1px solid #ddd;border-radius:6px;font-family:inherit;margin-bottom:10px}button{background:#0f67b1;color:white;border:none;cursor:pointer;width:100%}</style></head><body><div id="login" class="login"><div class="login-box"><h1>🌿 NewPharma</h1><input type="email" id="email" value="equipo@newpharma.cl"><input type="password" id="pass" value="NewPharma2024"><button onclick="login()">Ingresar</button></div></div><div id="app" class="app hide"><div class="header"><h1>🌿 NewPharma Campañas</h1><button onclick="logout()">Salir</button></div><select id="month" onchange="render()"><option value="8" selected>Septiembre</option><option value="5">Junio</option></select><div class="calendar" id="cal"></div><div class="campaigns" id="camps"></div></div><script>const firebaseConfig={apiKey:"AIzaSyAbP3I8R8_iPxs1NOGFLw_umL0hWvBDOxM",authDomain:"newpharma-campaigns.firebaseapp.com",projectId:"newpharma-campaigns",storageBucket:"newpharma-campaigns.firebasestorage.app",messagingSenderId:"32317378834",appId:"1:32317378834:web:fc65d0cf39bcee3f6be3cb"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();console.log("✅ Firebase OK");let data={b2c:{}};function login(){const email=document.getElementById("email").value;localStorage.setItem("user",email);document.getElementById("login").classList.add("hide");document.getElementById("app").classList.remove("hide");load()}function logout(){localStorage.removeItem("user");location.reload()}function load(){db.collection("data").doc("main").get().then(doc=>{data=doc.exists?doc.data().data||data:data;render()}).catch(err=>{console.error(err);render()})}function render(){const month=parseInt(document.getElementById("month").value);const key=`2026_${month}_b2c`;const camps=data.b2c[key]||[];let cal="";const days=[31,28,31,30,31,30,31,31,30,31,30,31][month];for(let d=1;d<=days;d++){const camp=camps.find(c=>d>=c.from&&d<=c.to);cal+=`<div class="day ${camp?"active":""}"><strong>${d}</strong>${camp?`<br><small>${camp.name}</small>`:""}</div>`}document.getElementById("cal").innerHTML=cal;let html="";camps.forEach(c=>{html+=`<div class="campaign"><h3>${c.name}</h3><small>${c.from}-${c.to}</small></div>`});document.getElementById("camps").innerHTML=html||"<p style='color:#999;text-align:center'>Sin campañas</p>"}if(localStorage.getItem("user")){document.getElementById("login").classList.add("hide");document.getElementById("app").classList.remove("hide");load()}</script></body></html>
