<!DOCTYPE html>
<html lang="es">
<head>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: white; padding: 25px; border-radius: 12px; margin-bottom: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 26px; color: #1a1a1a; }
        button { padding: 10px 20px; border: none; border-radius: 6px; font-weight: 500; cursor: pointer; font-size: 14px; }
        .btn-primary { background: #6B8E23; color: white; }
        .btn-primary:hover { background: #556b1a; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-danger { background: #ffebee; color: #c62828; font-size: 12px; padding: 6px 12px; }
        .controls { display: flex; gap: 15px; margin-bottom: 20px; background: white; padding: 15px 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .control { display: flex; gap: 8px; align-items: center; }
        .control label { font-weight: 500; font-size: 13px; }
        select { padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-family: 'Inter'; }
        .content { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 30px; }
        .day-header { font-weight: 600; text-align: center; color: #6B8E23; padding: 10px; font-size: 12px; background: #f5f5f5; border-radius: 4px; }
        .day { border: 1px solid #ddd; border-radius: 6px; padding: 8px; min-height: 70px; font-size: 11px; background: white; }
        .day.empty { background: #f5f5f5; border: none; }
        .day-num { font-weight: 700; color: #333; font-size: 13px; }
        .day-camp { font-size: 9px; margin-top: 4px; font-weight: 600; }
        .day-camp + .day-camp { margin-top: 3px; padding-top: 3px; border-top: 1px dashed #ccc; }
        .porllegar { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-bottom: 30px; }
        .pll-card { background:#fff; border:1px solid #e4e9dc; border-left:4px solid #6B8E23; border-radius:10px; padding:14px; }
        .pll-prod { font-size:14px; font-weight:700; color:#333; margin-bottom:4px; }
        .pll-cant { font-size:13px; color:#6B8E23; font-weight:700; margin-bottom:8px; }
        .pll-meta { font-size:11px; color:#888; line-height:1.6; }
        .pll-meta b { color:#555; }
        .campaigns { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .campaign { background: #f9f9f9; border-radius: 10px; padding: 18px; border-left: 4px solid; }
        .camp-title { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
        .camp-date { font-size: 11px; color: #999; margin-bottom: 10px; }
        .products { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .product { background: #e8f5e9; color: #2e7d32; padding: 3px 8px; border-radius: 12px; font-size: 10px; }
        .tasks { margin-top: 12px; border-top: 1px solid #ddd; padding-top: 10px; }
        .task-group { margin-bottom: 8px; }
        .task-title { font-size: 11px; font-weight: 600; color: #333; margin-bottom: 5px; }
        .task-item { display: flex; gap: 6px; align-items: center; font-size: 11px; margin-bottom: 3px; }
        .task-item input { cursor: pointer; }
        .login { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .login.show { display: flex; }
        .login-box { background: white; padding: 35px; border-radius: 12px; width: 100%; max-width: 350px; }
        .login-box h2 { text-align: center; margin-bottom: 25px; font-size: 20px; }
        .login-box input { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 6px; font-family: 'Inter'; }
        .login-box button { width: 100%; }
        .btn-add { width: 100%; margin-top: 20px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 2000; }
        .modal.show { display: flex; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal-content h3 { margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 13px; font-weight: 500; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-family: 'Inter'; font-size: 13px; }
        .form-group textarea { min-height: 50px; resize: vertical; }
        .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 15px; }
        .empty { text-align: center; color: #999; padding: 30px; }
    .modal-tabs { display:flex; gap:4px; margin-bottom:15px; border-bottom:2px solid #eee; }
.modal-tab { flex:1; padding:10px; background:none; border:none; border-bottom:3px solid transparent; cursor:pointer; font-weight:500; font-size:13px; color:#888; }
.modal-tab.active { color:#6B8E23; border-bottom-color:#6B8E23; }
.modal-pane { display:none; }
.modal-pane.active { display:block; }
.color-picker { display:flex; flex-wrap:wrap; gap:8px; }
.color-swatch { width:30px; height:30px; border-radius:50%; cursor:pointer; border:3px solid transparent; }
.color-swatch.sel { border-color:#333; }
.prod-head { display:grid; grid-template-columns:2fr 1fr 64px 1fr 24px; gap:8px; font-size:10px; color:#999; font-weight:600; padding:0 6px; margin-bottom:4px; }
.prod-row { display:grid; grid-template-columns:2fr 1fr 64px 1fr 24px; gap:8px; align-items:center; padding:6px; background:#f9f9f9; border-radius:6px; margin-bottom:6px; font-size:12px; }
.prod-row .pname { font-weight:600; }
.prod-row input { width:100%; padding:4px; border:1px solid #ddd; border-radius:4px; font-family:inherit; }
.prod-x { color:#c62828; cursor:pointer; font-weight:bold; text-align:center; }
.btn-pdf { background:#E53935; color:white; }
.btn-pdf:hover { background:#c62828; }
.header img { display:block; border-radius:4px; }
@media(max-width:760px){ .header { flex-direction:column; gap:14px; align-items:flex-start; } .header > div:last-child { flex-wrap:wrap; } }
</style>
</head>
<body>
    <div id="loginScreen" class="login show">
        <div class="login-box">
            <h2>🌿 NewPharma</h2>
            <input type="email" id="email" placeholder="Email" value="equipo@newpharma.cl">
            <input type="password" id="password" placeholder="Contraseña" value="NewPharma2024">
            <button class="btn-primary" onclick="login()" style="width: 100%;">Ingresar</button>
        </div>
    </div>

    <div id="app" style="display: none;">
        <div class="container">
            <div class="header">
                <div style="display:flex; align-items:center; gap:12px;"><img src="https://www.newpharma.cl/cdn/shop/files/logo-400x100_46b818c9-bfea-4838-b51e-4c07c18ad3d4.jpg" alt="NewPharma" style="height:40px; width:auto;"><h1>Planificación</h1></div>
                <div style="display:flex; gap:10px; align-items:center;"><button class="btn-pdf" onclick="descargarPDF()">📄 Descargar PDF</button><button class="btn-primary" onclick="openNewCampaign()">➕ Agregar Campaña</button><button class="btn-secondary" onclick="logout()">Salir</button></div>

            <div class="controls">
                <div class="control">
                    <label>Año:</label>

                        <option value="2026">2026</option>

                <div class="control">
                    <label>Mes:</label>
                    <select id="month" onchange="load()">
                        <option value="0">Enero</option>

                        <option value="3">Abril</option>

                        <option value="6">Julio</option>
                        <option value="7">Agosto</option>

                        <option value="9">Octubre</option>

                </div>

                    <label>Área:</label>
                    <select id="area" onchange="load()">

            <div class="content">
                <h3 style="margin-bottom: 15px;">Calendario</h3>
                <div class="calendar" id="calendar"></div>
                

                <h3 style="margin-top: 30px; margin-bottom: 15px;">Campañas</h3>
                <div class="campaigns" id="campaigns"></div>
            </div>
        </div>
    </div>

    <!-- MODAL NUEVA CAMPAÑA -->
    <div id="modal" class="modal">
<div class="modal-content">
<h3 id="modalTitle">Nueva Campaña</h3>
<div class="modal-tabs">
<button type="button" class="modal-tab active" onclick="modalTab(0)">⚙️ Configuración</button>
<button type="button" class="modal-tab" onclick="modalTab(1)">🏷️ Productos</button>

</div>
<div class="modal-pane active" id="pane0">
<div class="form-group"><label>Nombre de la campaña</label><input type="text" id="campName"></div>
<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
<div class="form-group"><label>Día Inicio</label><input type="number" id="dayStart" min="1" max="31" value="1"></div>

</div>

<div class="form-group"><label>Objetivo de la campaña</label><textarea id="objetivo" placeholder="Que busca lograr esta campana?"></textarea></div>
</div>

<div style="display:flex; gap:8px; align-items:center; margin-bottom:12px;">
<select id="prodSelect" style="flex:1; padding:8px; border:1px solid #ddd; border-radius:6px;"><option value="">Cargando productos...</option></select>
<button type="button" class="btn-primary" onclick="agregarProducto()">Agregar</button>
</div>
<div id="prodList"></div>
<button type="button" class="btn-secondary" onclick="actualizarPreciosShopify()" style="margin-top:10px; font-size:12px;">🔄 Actualizar precios desde Shopify</button>

<div class="form-group"><label>📣 Actividades de Marketing (una por línea)</label><textarea id="social_tasks"></textarea></div>
<div class="form-group"><label>🛒 Actividades Ecommerce (una por línea)</label><textarea id="ecom_tasks"></textarea></div>

</div>

<button class="btn-secondary" onclick="closeModal()">Cancelar</button>

</div>
</div>

<div id="entregasModal" class="modal">
<div class="modal-content">
<h3>🚚 Entregas</h3>
<div class="modal-tabs">
<button type="button" class="modal-tab active" id="tabProx" onclick="switchEntregaTab('prox')">Próximas entregas</button>
<button type="button" class="modal-tab" id="tabUlt" onclick="switchEntregaTab('ult')">Última entrega</button>
</div>
<div class="modal-pane active" id="paneProx"></div>
<div class="modal-pane" id="paneUlt"></div>
<div class="modal-buttons">
<button class="btn-secondary" onclick="closeEntregas()">Cerrar</button>
</div>
</div>

<script>
const firebaseConfig = {
apiKey: "AIzaSyAbP3I8R8_iPxs1NOGFLw_umL0hWvBDOxM",
authDomain: "newpharma-campaigns.firebaseapp.com",
projectId: "newpharma-campaigns",
storageBucket: "newpharma-campaigns.firebasestorage.app",
messagingSenderId: "32317378834",
appId: "1:32317378834:web:fc65d0cf39bcee3f6be3cb"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
console.log("Firebase OK");
function ensureKeys() {
for (let y = 2026; y <= 2027; y++) { for (let m = 0; m < 12; m++) { const k = y+'_'+m; if (!data.b2c[k]) data.b2c[k]=[]; if (!data.b2b[k]) data.b2b[k]=[]; } }
}
function saveToFirestore() {
db.collection('data').doc('main').set({ data, nextId, updatedAt: new Date() }).then(()=>console.log("Guardado Firestore")).catch(e=>console.error(e));
}
function loadFromFirestore() {
db.collection('data').doc('main').get().then(doc=>{ if(doc.exists){ const d=doc.data(); if(d.data) data=d.data; if(d.nextId) nextId=d.nextId; ensureKeys(); localStorage.setItem('data',JSON.stringify(data)); localStorage.setItem('nextId',nextId.toString()); console.log("Cargado Firestore"); load(); } }).catch(e=>console.error(e));
}

/* ---- Entregas: modal con 2 pestañas (lee la app de Órdenes de Compra) ---- */
let comprasData = {empresas:[], ordenes:[]};
function loadCompras() {
  db.collection('compras').doc('main').onSnapshot(doc=>{
    if(doc.exists && doc.data().data){ comprasData = doc.data().data; if(document.getElementById('entregasModal').classList.contains('show')) renderEntregas(); }
  }, e=>console.error('compras:',e));
}
function openEntregas(){ renderEntregas(); switchEntregaTab('prox'); document.getElementById('entregasModal').classList.add('show'); }
function closeEntregas(){ document.getElementById('entregasModal').classList.remove('show'); }
function switchEntregaTab(t){
  document.getElementById('tabProx').classList.toggle('active', t==='prox');
  document.getElementById('tabUlt').classList.toggle('active', t==='ult');
  document.getElementById('paneProx').classList.toggle('active', t==='prox');
  document.getElementById('paneUlt').classList.toggle('active', t==='ult');
}
function renderEntregas(){
  renderProximas();
  renderUltima();
}
function renderProximas(){
  const cont = document.getElementById('paneProx');
  const items = [];
  (comprasData.ordenes||[]).forEach(oc=>{
    if(oc.finalizado) return;
    const prov = (comprasData.empresas||[]).find(e=>e.id===oc.empresaId);
    (oc.lineas||[]).forEach(l=>{
      const pend = (+l.solicitada||0) - (+l.entrega1||0) - (+l.entrega2||0);
      if(pend>0){
        items.push({ nombre:l.nombre||l.sku||'(producto)', cant:pend, oc:oc.numero||'(sin número)',
          fechaOrden:oc.fecha||'', proveedor:prov?prov.nombre:'', fe1:oc.fechaEntrega1||'', fe2:oc.fechaEntrega2||'' });
      }
    });
  });
  if(!items.length){ cont.innerHTML='<div class="empty">No hay productos pendientes por llegar.</div>'; return; }
  items.sort((a,b)=> (b.fechaOrden||'').localeCompare(a.fechaOrden||''));
  cont.innerHTML = '<div class="porllegar">'+items.map(it=>{
    let fe='';
    if(it.fe1) fe+='<div>📅 Entrega 1: <b>'+it.fe1+'</b></div>';
    if(it.fe2) fe+='<div>📅 Entrega 2: <b>'+it.fe2+'</b></div>';
    return '<div class="pll-card">'+
      '<div class="pll-prod">'+it.nombre+'</div>'+
      '<div class="pll-cant">'+it.cant+' unidades por llegar</div>'+
      '<div class="pll-meta">'+
        '<div>OC: <b>'+it.oc+'</b>'+(it.proveedor?(' · '+it.proveedor):'')+'</div>'+
        '<div>Fecha orden: <b>'+(it.fechaOrden||'—')+'</b></div>'+ fe +
      '</div>'+
    '</div>';
  }).join('')+'</div>';
}
function renderUltima(){
  const cont = document.getElementById('paneUlt');
  const items = [];
  (comprasData.ordenes||[]).forEach(oc=>{
    const prov = (comprasData.empresas||[]).find(e=>e.id===oc.empresaId);
    (oc.lineas||[]).forEach(l=>{
      // Cada entrega ya recibida (cantidad > 0) es un evento de llegada
      if((+l.entrega1||0)>0){
        items.push({ nombre:l.nombre||l.sku||'(producto)', cant:+l.entrega1, oc:oc.numero||'(sin número)',
          proveedor:prov?prov.nombre:'', fecha:oc.fechaEntrega1||oc.fecha||'', etiqueta:'Entrega 1' });
      }
      if((+l.entrega2||0)>0){
        items.push({ nombre:l.nombre||l.sku||'(producto)', cant:+l.entrega2, oc:oc.numero||'(sin número)',
          proveedor:prov?prov.nombre:'', fecha:oc.fechaEntrega2||oc.fecha||'', etiqueta:'Entrega 2' });
      }
    });
  });
  if(!items.length){ cont.innerHTML='<div class="empty">Aún no hay entregas recibidas.</div>'; return; }
  items.sort((a,b)=> (b.fecha||'').localeCompare(a.fecha||'')); // más reciente primero
  cont.innerHTML = '<div class="porllegar">'+items.map(it=>{
    return '<div class="pll-card" style="border-left-color:#2e7d32;">'+
      '<div class="pll-prod">'+it.nombre+'</div>'+
      '<div class="pll-cant" style="color:#2e7d32;">'+it.cant+' unidades recibidas</div>'+
      '<div class="pll-meta">'+
        '<div>OC: <b>'+it.oc+'</b>'+(it.proveedor?(' · '+it.proveedor):'')+'</div>'+
        '<div>'+it.etiqueta+' · Fecha: <b>'+(it.fecha||'—')+'</b></div>'+
      '</div>'+
    '</div>';
  }).join('')+'</div>';
}
const DAYS = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
        const MONTHS = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
        let data = {b2c: {}, b2b: {}};
        let nextId = 1;

        function init() {
            const saved = localStorage.getItem('data');
            if (saved) data = JSON.parse(saved);
            nextId = parseInt(localStorage.getItem('nextId') || '1');
            
            for (let y = 2026; y <= 2027; y++) {
                for (let m = 0; m < 12; m++) {
                    const key = `${y}_${m}`;
                    if (!data.b2c[key]) data.b2c[key] = [];
                    if (!data.b2b[key]) data.b2b[key] = [];
                }
            }

            // Ejemplo
            if (data.b2c['2026_7'].length === 0) {
                data.b2c['2026_7'].push({
                    id: 1,
                    name: "Hongos",
                    dates: "1-7",
                    dayStart: 1,
                    dayEnd: 7,
                    color: '#6B8E23',
                    products: ["Reishi", "Cordyceps"],
                    email: ["Email 1"],
                    social: ["RRSS 1"],
                    ecom: ["Ecom 1"]
                });
            }
        }

        function login() {
            if (document.getElementById('email').value && document.getElementById('password').value) {
                localStorage.setItem('user', document.getElementById('email').value);
                document.getElementById('loginScreen').classList.remove('show');
                document.getElementById('app').style.display = 'block';
                init();
load();
loadFromFirestore();
loadCompras();
            }
        }

        function logout() {
            localStorage.removeItem('user');
            document.getElementById('loginScreen').classList.add('show');
            document.getElementById('app').style.display = 'none';
        }

        function load() {
            renderCalendar();
            renderCampaigns();
        }

        function renderCalendar() {
            const year = parseInt(document.getElementById('year').value);
            const month = parseInt(document.getElementById('month').value);
            const area = document.getElementById('area').value;
            const key = `${year}_${month}`;
            const camps = data[area][key] || [];
            const daysInMonth = DAYS[month];
            const firstDay = new Date(year, month, 1).getDay() - 1;

            let html = '';
            ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].forEach(d => {
                html += `<div class="day-header">${d}</div>`;
            });

            for (let i = 0; i < Math.max(0, firstDay); i++) {
                html += '<div class="day empty"></div>';
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dayCamps = camps.filter(c => day >= c.dayStart && day <= c.dayEnd);
                if (dayCamps.length) {
                    const main = dayCamps[0];
                    const labels = dayCamps.map(c =>
                        `<div class="day-camp" style="color: ${c.color};">${c.name}</div>`
                    ).join('');
                    const bg = dayCamps.length>1 ? '#f5f5f5' : `${main.color}20`;
                    const border = dayCamps.length>1 ? '2px solid #999' : `2px solid ${main.color}`;
                    html += `<div class="day" style="border: ${border}; background-color: ${bg}; cursor:pointer;" onclick="editCampaign(${main.id})">
                        <div class="day-num">${day}</div>
                        ${labels}
                    </div>`;
                } else {
                    html += `<div class="day" style="cursor:pointer;" onclick="nuevaCampDia(${day})"><div class="day-num">${day}</div></div>`;
                }
            }

            document.getElementById('calendar').innerHTML = html;
        }

        function renderCampaigns() {
            const year = parseInt(document.getElementById('year').value);
            const month = parseInt(document.getElementById('month').value);
            const area = document.getElementById('area').value;
            const key = `${year}_${month}`;
            const camps = data[area][key] || [];

            if (camps.length === 0) {
                document.getElementById('campaigns').innerHTML = '<div class="empty">Haz clic en "Agregar Campaña" para crear una</div>';
                return;

function cargarProductosWeb(){ var sel=document.getElementById('prodSelect'); if(window.__productosWeb.length){ llenarSelectProd(); return; } fetch('https://www.newpharma.cl/products.json?limit=250').then(function(r){return r.json();}).then(function(d){ window.__productosWeb=(d.products||[]).map(function(p){ var v=(p.variants&&p.variants[0])?p.variants[0]:{}; return {nombre:p.title, full:(parseInt(v.compare_at_price||'0')||parseInt(v.price||'0'))}; }).filter(function(x){return x.full>0;}); llenarSelectProd(); }).catch(function(e){ sel.innerHTML='<option value="">Error al cargar productos</option>'; }); }

var y=18;
doc.setFontSize(20); doc.setTextColor(40,40,40);

doc.setFontSize(12); doc.setTextColor(120,120,120);

doc.setDrawColor(107,142,35); doc.setLineWidth(0.8); doc.line(15,y,W-15,y); y+=10;

camps.forEach(function(c){
if(y>265){ doc.addPage(); y=18; }
doc.setFontSize(14); doc.setTextColor(30,30,30);
doc.text(c.name+'   (dias '+c.dates+')',15,y); y+=7;
if(c.objetivo){ doc.setFontSize(10); doc.setTextColor(90,90,90); var ol=doc.splitTextToSize('Objetivo: '+c.objetivo, W-30); doc.text(ol,15,y); y+=ol.length*5+1; }
if(c.prods && c.prods.length){ doc.setFontSize(10); doc.setTextColor(46,125,50); doc.text('Productos:',15,y); y+=5; doc.setTextColor(60,60,60); c.prods.forEach(function(p){ if(y>278){doc.addPage(); y=18;} var ln='   - '+p.nombre+': '+fmtPrecio(p.full); if(p.desc>0) ln+='  =>  '+fmtPrecio(p.oferta)+' (-'+p.desc+'%)'; var pl=doc.splitTextToSize(ln,W-30); doc.text(pl,15,y); y+=pl.length*5; }); }
var bloques=[['Marketing',c.social],['Ecommerce',c.ecom],['Email',c.email]];
bloques.forEach(function(b){ if(b[1] && b[1].length){ if(y>275){doc.addPage(); y=18;} doc.setFontSize(10); doc.setTextColor(30,136,229); doc.text(b[0]+':',15,y); y+=5; doc.setTextColor(60,60,60); b[1].forEach(function(t){ if(y>278){doc.addPage(); y=18;} var tl=doc.splitTextToSize('   - '+t,W-30); doc.text(tl,15,y); y+=tl.length*5; }); } });
y+=5; doc.setDrawColor(225,225,225); doc.setLineWidth(0.3); doc.line(15,y-3,W-15,y-3); y+=4;
});
doc.save('Planificacion_'+MS[month]+'_'+year+'.pdf');
}

renderProdList = function(){

var html='<div class="prod-head"><span>Producto</span><span>Full</span><span>% Desc</span><span>Oferta</span><span></span></div>';
window.__campProductos.forEach(function(p,idx){
html+='<div class="prod-row">';
html+='<span class="pname">'+p.nombre+'</span>';
html+='<input type="number" min="0" value="'+p.full+'" oninput="cambiarFull('+idx+', this.value)">';
html+='<input type="number" min="0" max="100" value="'+p.desc+'" oninput="cambiarDesc('+idx+', this.value)">';
html+='<span id="of-'+idx+'">'+fmtPrecio(p.oferta)+'</span>';

function cambiarFull(idx,val){ var f=parseFloat(val)||0; if(f<0)f=0; window.__campProductos[idx].full=f; window.__campProductos[idx].oferta=Math.round(f*(1-window.__campProductos[idx].desc/100)); var of=document.getElementById('of-'+idx); if(of) of.textContent=fmtPrecio(window.__campProductos[idx].oferta); }
function actualizarPreciosShopify(){
var st=document.getElementById('prodStatus');
if(!window.__campProductos.length){ if(st) st.textContent='No hay productos en esta campaña para actualizar.'; return; }
if(st){ st.style.color='#888'; st.textContent='Actualizando precios desde Shopify...'; }
fetch('https://www.newpharma.cl/products.json?limit=250').then(function(r){return r.json();}).then(function(d){
var web=(d.products||[]).map(function(p){ var v=(p.variants&&p.variants[0])?p.variants[0]:{}; return {nombre:p.title, full:(parseInt(v.compare_at_price||'0')||parseInt(v.price||'0'))}; }).filter(function(x){return x.full>0;});
window.__productosWeb=web;
var n=0;
window.__campProductos.forEach(function(cp){ var w=web.find(function(x){return x.nombre===cp.nombre;}); if(w && w.full>0){ cp.full=w.full; cp.oferta=Math.round(w.full*(1-cp.desc/100)); n++; } });
renderProdList();
if(st){ st.style.color='#6B8E23'; st.textContent='Precios actualizados: '+n+' de '+window.__campProductos.length+' productos.'; }
}).catch(function(e){ if(st){ st.style.color='#c62828'; st.textContent='No se pudieron actualizar los precios. Revisa la conexión.'; } });
}
