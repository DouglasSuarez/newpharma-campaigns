<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificación NewPharma v2.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 28px; color: #1a1a1a; margin-bottom: 5px; }
        .header p { color: #666; font-size: 14px; }
        button { padding: 10px 20px; border: none; border-radius: 6px; font-weight: 500; cursor: pointer; transition: all 0.3s; font-size: 14px; }
        .btn-primary { background: #6B8E23; color: white; }
        .btn-primary:hover { background: #556b1a; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-pdf { background: #2196F3; color: white; padding: 8px 16px; font-size: 12px; }
        .btn-danger { background: #ffebee; color: #c62828; padding: 6px 12px; font-size: 12px; }
        .controls { display: flex; gap: 15px; margin-bottom: 20px; background: white; padding: 15px 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); flex-wrap: wrap; }
        .control-group { display: flex; gap: 10px; align-items: center; }
        .control-group label { font-weight: 500; color: #333; font-size: 13px; }
        select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; font-family: 'Inter', sans-serif; }
        .tabs-container { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .tabs-header { display: flex; border-bottom: 2px solid #eee; padding: 0 20px; }
        .tab-button { padding: 16px 20px; background: none; border: none; cursor: pointer; font-size: 14px; font-weight: 500; color: #999; border-bottom: 3px solid transparent; }
        .tab-button.active { color: #6B8E23; border-bottom-color: #6B8E23; }
        .tabs-content { padding: 30px; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        .calendar-section { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .calendar-title { font-size: 16px; font-weight: 600; margin-bottom: 20px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        .day-header { font-weight: 600; text-align: center; color: #6B8E23; padding: 12px; font-size: 12px; background: #f5f5f5; border-radius: 4px; }
        .calendar-day { border: 2px solid #ddd; border-radius: 6px; padding: 10px; cursor: pointer; min-height: 80px; font-size: 12px; background: white; transition: all 0.2s; }
        .calendar-day:hover { background: #f9f9f9; border-color: #6B8E23; }
        .calendar-day.empty { background: #f5f5f5; cursor: default; border: none; }
        .day-number { font-weight: 700; color: #333; font-size: 14px; }
        .campaigns-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .campaign-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-left: 5px solid; }
        .campaign-title { font-size: 16px; font-weight: 600; color: #1a1a1a; }
        .product-tag { display: inline-block; background: #e8f5e9; color: #2e7d32; padding: 3px 8px; border-radius: 12px; font-size: 11px; margin-right: 4px; }
        .progress-bar { width: 100%; height: 6px; background: #e0e0e0; border-radius: 3px; margin: 5px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #6B8E23, #9ACD32); transition: width 0.3s; }
        .task-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 12px; }
        .task-item input[type="checkbox"] { cursor: pointer; accent-color: #6B8E23; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; color: #333; font-size: 13px; }
        .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-family: 'Inter', sans-serif; }
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .sales-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 20px; }
        .sales-table th { background: #f5f5f5; padding: 12px; text-align: left; font-weight: 600; border-bottom: 2px solid #ddd; }
        .sales-table td { padding: 12px; border-bottom: 1px solid #eee; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .stat-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-left: 5px solid #6B8E23; }
        .stat-value { font-size: 32px; font-weight: 700; color: #6B8E23; }
        .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #6B8E23 0%, #9ACD32 100%); }
        .login-box { background: white; padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; }
        .login-box input { width: 100%; margin-bottom: 15px; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal.show { display: flex; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; max-width: 600px; width: 100%; max-height: 80vh; overflow-y: auto; }
        .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        @media (max-width: 768px) { .campaigns-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div id="loginContainer" class="login-container">
        <div class="login-box">
            <h2 style="text-align: center; margin-bottom: 30px;">🌿 Planificación NewPharma v2.0</h2>
            <input type="email" id="loginEmail" placeholder="Email" value="equipo@newpharma.cl">
            <input type="password" id="loginPassword" placeholder="Contraseña" value="NewPharma2024">
            <button class="btn-primary" style="width: 100%;" onclick="login()">Ingresar</button>
        </div>
    </div>

    <div id="mainApp" style="display: none;">
        <div class="container">
            <div class="header">
                <div>
                    <h1>🌿 Planificación NewPharma v2.0</h1>
                    <p>Gestiona campañas, ventas y análisis</p>
                </div>
                <div>
                    <span id="userEmail" style="font-size: 13px; color: #666; margin-right: 15px;"></span>
                    <button class="btn-secondary" onclick="logout()">Salir</button>
                </div>
            </div>

            <div class="controls">
                <div class="control-group">
                    <label>Año:</label>
                    <select id="yearSelect" onchange="loadMonth()">
                        <option value="2026">2026</option>
                        <option value="2027">2027</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Mes:</label>
                    <select id="monthSelect" onchange="loadMonth()">
                        <option value="0">Enero</option>
                        <option value="1">Febrero</option>
                        <option value="2">Marzo</option>
                        <option value="3">Abril</option>
                        <option value="4">Mayo</option>
                        <option value="5">Junio</option>
                        <option value="6">Julio</option>
                        <option value="7">Agosto</option>
                        <option value="8" selected>Septiembre</option>
                        <option value="9">Octubre</option>
                        <option value="10">Noviembre</option>
                        <option value="11">Diciembre</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Área:</label>
                    <select id="areaSelect" onchange="loadMonth()">
                        <option value="b2c">B2C (Consumidor)</option>
                        <option value="b2b">B2B (Mayorista)</option>
                    </select>
                </div>
                <button class="btn-pdf" onclick="exportFullPDF()" style="margin-left: auto;">📥 PDF</button>
            </div>

            <div class="tabs-container">
                <div class="tabs-header">
                    <button class="tab-button active" onclick="switchTab(event, 'campanas')">📅 Campañas</button>
                    <button class="tab-button" onclick="switchTab(event, 'ventas')">💰 Ventas</button>
                    <button class="tab-button" onclick="switchTab(event, 'analisis')">📊 Análisis</button>
                </div>

                <div class="tabs-content">
                    <div id="campanas" class="tab-pane active">
                        <div class="calendar-section">
                            <div class="calendar-title" id="calendarTitle">Calendario</div>
                            <div class="calendar-grid" id="calendarGrid"></div>
                        </div>
                        <h3 style="margin-top: 40px; margin-bottom: 20px;">Campañas del Mes</h3>
                        <div id="campaignsContainer" class="campaigns-grid"></div>
                    </div>

                    <div id="ventas" class="tab-pane">
                        <h3 style="margin-bottom: 20px;">Registrar Ventas</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Producto</label>
                                <select id="saleProduct"><option value="">-- Selecciona --</option></select>
                            </div>
                            <div class="form-group">
                                <label>Cantidad</label>
                                <input type="number" id="saleQuantity" min="0">
                            </div>
                            <div class="form-group">
                                <label>Fecha</label>
                                <input type="date" id="saleDate">
                            </div>
                            <div class="form-group" style="display: flex; align-items: flex-end;">
                                <button class="btn-primary" onclick="addSale()">Registrar</button>
                            </div>
                        </div>
                        <h3 style="margin-top: 40px; margin-bottom: 20px;">Ventas</h3>
                        <table class="sales-table">
                            <thead>
                                <tr>
                                    <th>Fecha</th>
                                    <th>Producto</th>
                                    <th>Cantidad</th>
                                    <th>Ingresos</th>
                                </tr>
                            </thead>
                            <tbody id="salesTableBody"></tbody>
                        </table>
                    </div>

                    <div id="analisis" class="tab-pane">
                        <h3 style="margin-bottom: 30px;">% Cumplimiento</h3>
                        <div class="stats-grid">
                            <div class="stat-card">
                                <h3>📧 EMAIL</h3>
                                <div class="stat-value" id="emailPercent">0%</div>
                                <div class="progress-bar"><div class="progress-fill" id="emailFill"></div></div>
                            </div>
                            <div class="stat-card">
                                <h3>📱 RRSS</h3>
                                <div class="stat-value" id="rrssPercent">0%</div>
                                <div class="progress-bar"><div class="progress-fill" id="rrssFill"></div></div>
                            </div>
                            <div class="stat-card">
                                <h3>🛒 E-COMMERCE</h3>
                                <div class="stat-value" id="ecommercePercent">0%</div>
                                <div class="progress-bar"><div class="progress-fill" id="ecommerceFill"></div></div>
                            </div>
                            <div class="stat-card" style="border-left-color: #FF6B6B;">
                                <h3>📊 GENERAL</h3>
                                <div class="stat-value" id="generalPercent" style="color: #FF6B6B;">0%</div>
                                <div class="progress-bar"><div class="progress-fill" id="generalFill" style="background: linear-gradient(90deg, #FF6B6B, #FFB3B3);"></div></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL PARA CREAR/EDITAR CAMPAÑA -->
    <div id="campaignModal" class="modal">
        <div class="modal-content">
            <h2 style="margin-bottom: 20px;">Nueva Campaña</h2>
            <div class="form-group">
                <label>Nombre</label>
                <input type="text" id="campaignName" placeholder="Ej: Hongos Funcionales">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Día Inicio</label>
                    <input type="number" id="dayStart" min="1" max="31">
                </div>
                <div class="form-group">
                    <label>Día Fin</label>
                    <input type="number" id="dayEnd" min="1" max="31">
                </div>
                <div class="form-group">
                    <label>Color</label>
                    <select id="campaignColor">
                        <option value="#6B8E23">Verde</option>
                        <option value="#FF6B6B">Rojo</option>
                        <option value="#4ECDC4">Turquesa</option>
                        <option value="#FFE66D">Amarillo</option>
                        <option value="#95E1D3">Menta</option>
                        <option value="#F38181">Rosa</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Productos (separados por coma)</label>
                <input type="text" id="campaignProducts" placeholder="Reishi 3:1, Cordyceps 3:1">
            </div>
            <div class="form-group">
                <label>Tareas Email (una por línea)</label>
                <textarea id="campaignEmail" style="width: 100%; min-height: 60px; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-family: 'Inter', sans-serif;"></textarea>
            </div>
            <div class="form-group">
                <label>Tareas RRSS (una por línea)</label>
                <textarea id="campaignSocial" style="width: 100%; min-height: 60px; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-family: 'Inter', sans-serif;"></textarea>
            </div>
            <div class="form-group">
                <label>Tareas E-commerce (una por línea)</label>
                <textarea id="campaignEcommerce" style="width: 100%; min-height: 60px; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-family: 'Inter', sans-serif;"></textarea>
            </div>
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
                <button class="btn-primary" onclick="saveCampaign()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        const PRODUCTS = [
            {name: "Reishi 3:1 Sublingual", price: 13500},
            {name: "Cordyceps 3:1 Sublingual", price: 13500},
            {name: "Lion's Mane 3:1 Sublingual", price: 13500},
            {name: "Triple Complex Sublingual", price: 13990},
            {name: "Creatina 300g", price: 10990},
            {name: "Ashwagandha 60 Cápsulas", price: 14990},
            {name: "Vitamina D3 60 Gominolas", price: 14990},
            {name: "Coffee Creamer 180g", price: 11990},
            {name: "Vinagre de Sidra 60 Gominolas", price: 14500},
            {name: "Fungi Complex 60 Cápsulas", price: 13990},
            {name: "Reishi 60 Gominolas", price: 13990},
            {name: "Shiitake 60 Gominolas", price: 13990},
            {name: "Wake Up 60 Gominolas", price: 13990},
        ];

        const DAYS_IN_MONTH = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
        const MONTH_NAMES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

        let currentYear = 2026;
        let currentMonthIndex = 8;
        let currentArea = 'b2c';
        let campaigns = {};
        let sales = [];
        let taskCompletion = {};
        let nextCampaignId = 1;

        function initData() {
            campaigns = JSON.parse(localStorage.getItem('newpharma_campaigns') || '{"b2c":{}, "b2b":{}}');
            sales = JSON.parse(localStorage.getItem('newpharma_sales') || '[]');
            taskCompletion = JSON.parse(localStorage.getItem('newpharma_tasks') || '{}');
            nextCampaignId = parseInt(localStorage.getItem('newpharma_nextId') || '1');
            
            if (!campaigns.b2c) campaigns.b2c = {};
            if (!campaigns.b2b) campaigns.b2b = {};
            
            for (let year = 2026; year <= 2027; year++) {
                for (let i = 0; i < 12; i++) {
                    const key = `${year}_${i}`;
                    if (!campaigns.b2c[key]) campaigns.b2c[key] = [];
                    if (!campaigns.b2b[key]) campaigns.b2b[key] = [];
                }
            }
            
            // Agregar campaña de ejemplo si no existe
            if (campaigns.b2c['2026_7'].length === 0) {
                campaigns.b2c['2026_7'].push({
                    id: 1,
                    name: "Hongos Funcionales",
                    dates: "1-7 de agosto",
                    dayStart: 1,
                    dayEnd: 7,
                    color: '#6B8E23',
                    products: ["Reishi 3:1 Sublingual", "Cordyceps 3:1 Sublingual"],
                    email: ["Lunes: Intro a hongos + Quiz"],
                    social: ["Instagram: Reels educativos"],
                    ecommerce: ["Colección destacada"]
                });
                saveCampaigns();
            }
            
            const select = document.getElementById('saleProduct');
            select.innerHTML = '<option value="">-- Selecciona --</option>' +
                PRODUCTS.map(p => `<option value="${p.name}">$${p.price} - ${p.name}</option>`).join('');
            
            document.getElementById('saleDate').valueAsDate = new Date();
        }

        function saveCampaigns() {
            localStorage.setItem('newpharma_campaigns', JSON.stringify(campaigns));
        }

        function login() {
            const email = document.getElementById('loginEmail').value;
            if (email) {
                localStorage.setItem('newpharma_user', email);
                document.getElementById('userEmail').textContent = email;
                document.getElementById('loginContainer').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
                initData();
                loadMonth();
            }
        }

        function logout() {
            localStorage.removeItem('newpharma_user');
            document.getElementById('loginContainer').style.display = 'flex';
            document.getElementById('mainApp').style.display = 'none';
        }

        function switchTab(e, tabName) {
            document.querySelectorAll('.tab-pane').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            e.target.classList.add('active');
            
            if (tabName === 'analisis') renderAnalysis();
        }

        function loadMonth() {
            currentYear = parseInt(document.getElementById('yearSelect').value);
            currentMonthIndex = parseInt(document.getElementById('monthSelect').value);
            currentArea = document.getElementById('areaSelect').value;
            
            document.getElementById('calendarTitle').textContent = `Calendario - ${MONTH_NAMES[currentMonthIndex]} ${currentYear}`;
            renderCalendar();
            renderCampaigns();
        }

        function getCampaignKey() {
            return `${currentYear}_${currentMonthIndex}`;
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const key = getCampaignKey();
            const daysInMonth = DAYS_IN_MONTH[currentMonthIndex];
            const firstDay = new Date(currentYear, currentMonthIndex, 1).getDay() - 1;
            const monthCampaigns = campaigns[currentArea][key] || [];
            
            let html = '';
            ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].forEach(day => {
                html += `<div class="day-header">${day}</div>`;
            });
            
            for (let i = 0; i < Math.max(0, firstDay); i++) {
                html += '<div class="calendar-day empty"></div>';
            }
            
            for (let day = 1; day <= daysInMonth; day++) {
                const campaign = monthCampaigns.find(c => day >= c.dayStart && day <= c.dayEnd);
                if (campaign) {
                    html += `<div class="calendar-day" style="border: 2px solid ${campaign.color}; background-color: ${campaign.color}20;" onclick="openCampaignModal()">
                        <div class="day-number">${day}</div>
                        <div style="font-size: 10px; color: ${campaign.color}; margin-top: 4px;">${campaign.name}</div>
                    </div>`;
                } else {
                    html += `<div class="calendar-day" onclick="openNewCampaignModal(${day})" style="cursor: pointer;">
                        <div class="day-number">${day}</div>
                        <div style="font-size: 10px; color: #999; margin-top: 4px;">+ Añadir</div>
                    </div>`;
                }
            }
            
            grid.innerHTML = html;
        }

        function openNewCampaignModal(day) {
            document.getElementById('campaignName').value = '';
            document.getElementById('dayStart').value = day;
            document.getElementById('dayEnd').value = day;
            document.getElementById('campaignColor').value = '#6B8E23';
            document.getElementById('campaignProducts').value = '';
            document.getElementById('campaignEmail').value = '';
            document.getElementById('campaignSocial').value = '';
            document.getElementById('campaignEcommerce').value = '';
            document.getElementById('campaignModal').classList.add('show');
        }

        function openCampaignModal() {
            // Simplemente mostrar modal vacío para crear nueva campaña
            openNewCampaignModal(1);
        }

        function closeModal() {
            document.getElementById('campaignModal').classList.remove('show');
        }

        function saveCampaign() {
            const name = document.getElementById('campaignName').value;
            const dayStart = parseInt(document.getElementById('dayStart').value);
            const dayEnd = parseInt(document.getElementById('dayEnd').value);
            const color = document.getElementById('campaignColor').value;
            const products = document.getElementById('campaignProducts').value.split(',').map(p => p.trim()).filter(p => p);
            const email = document.getElementById('campaignEmail').value.split('\n').map(e => e.trim()).filter(e => e);
            const social = document.getElementById('campaignSocial').value.split('\n').map(s => s.trim()).filter(s => s);
            const ecommerce = document.getElementById('campaignEcommerce').value.split('\n').map(e => e.trim()).filter(e => e);

            if (!name || !dayStart || !dayEnd) {
                alert('Completa nombre y días');
                return;
            }

            const key = getCampaignKey();
            const newCampaign = {
                id: nextCampaignId++,
                name,
                dates: `${dayStart}-${dayEnd}`,
                dayStart,
                dayEnd,
                color,
                products,
                email,
                social,
                ecommerce
            };

            campaigns[currentArea][key].push(newCampaign);
            localStorage.setItem('newpharma_nextId', nextCampaignId.toString());
            saveCampaigns();
            closeModal();
            renderCalendar();
            renderCampaigns();
        }

        function renderCampaigns() {
            const container = document.getElementById('campaignsContainer');
            const key = getCampaignKey();
            const monthCampaigns = campaigns[currentArea][key] || [];
            
            if (monthCampaigns.length === 0) {
                container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #999;">Haz clic en un día para crear campaña</div>';
                return;
            }
            
            container.innerHTML = monthCampaigns.map(c => `
                <div class="campaign-card" style="border-left-color: ${c.color};">
                    <div class="campaign-title">${c.name}</div>
                    <div style="font-size: 12px; color: #999; margin-bottom: 10px;">📅 ${c.dates}</div>
                    <div style="margin-bottom: 12px;">${c.products.map(p => `<span class="product-tag">${p}</span>`).join('')}</div>
                    
                    <div style="margin: 15px 0; padding: 10px; background: #f5f5f5; border-radius: 6px;">
                        <div style="font-size: 12px; font-weight: 600; color: #333; margin-bottom: 8px;">Tareas:</div>
                        <div style="font-size: 11px; color: #666;">📧 ${c.email.length} | 📱 ${c.social.length} | 🛒 ${c.ecommerce.length}</div>
                    </div>

                    <div style="display: flex; gap: 8px;">
                        <button class="btn-danger" style="flex: 1;" onclick="deleteCampaign('${c.id}')">🗑️ Eliminar</button>
                    </div>
                </div>
            `).join('');
        }

        function deleteCampaign(id) {
            if (confirm('¿Eliminar campaña?')) {
                const key = getCampaignKey();
                campaigns[currentArea][key] = campaigns[currentArea][key].filter(c => c.id != id);
                saveCampaigns();
                renderCalendar();
                renderCampaigns();
            }
        }

        function addSale() {
            const product = document.getElementById('saleProduct').value;
            const quantity = parseInt(document.getElementById('saleQuantity').value);
            const date = document.getElementById('saleDate').value;
            if (!product || !quantity || !date) return;
            
            const productData = PRODUCTS.find(p => p.name === product);
            sales.push({date, product, quantity, price: productData.price, revenue: quantity * productData.price, month: currentMonthIndex, year: currentYear, area: currentArea});
            localStorage.setItem('newpharma_sales', JSON.stringify(sales));
            renderSalesTable();
            document.getElementById('saleQuantity').value = '';
        }

        function renderSalesTable() {
            const tbody = document.getElementById('salesTableBody');
            const monthSales = sales.filter(s => s.month === currentMonthIndex && s.year === currentYear && s.area === currentArea);
            
            tbody.innerHTML = monthSales.map((s, idx) => `
                <tr>
                    <td>${new Date(s.date).toLocaleDateString('es-CL')}</td>
                    <td>${s.product}</td>
                    <td>${s.quantity}</td>
                    <td>$${s.revenue.toLocaleString()}</td>
                </tr>
            `).join('');
        }

        function renderAnalysis() {
            const key = getCampaignKey();
            const monthCampaigns = campaigns[currentArea][key] || [];
            
            let emailTotal = 0, emailCompleted = 0;
            let rrssTotal = 0, rrssCompleted = 0;
            let ecommerceTotal = 0, ecommerceCompleted = 0;
            
            monthCampaigns.forEach(c => {
                emailTotal += c.email.length;
                rrssTotal += c.social.length;
                ecommerceTotal += c.ecommerce.length;
            });
            
            const totalTasks = emailTotal + rrssTotal + ecommerceTotal;
            const emailPercent = emailTotal > 0 ? Math.round(0) : 0;
            const rrssPercent = rrssTotal > 0 ? Math.round(0) : 0;
            const ecommercePercent = ecommerceTotal > 0 ? Math.round(0) : 0;
            const generalPercent = totalTasks > 0 ? 0 : 0;
            
            document.getElementById('emailPercent').textContent = emailPercent + '%';
            document.getElementById('emailFill').style.width = emailPercent + '%';
            document.getElementById('rrssPercent').textContent = rrssPercent + '%';
            document.getElementById('rrssFill').style.width = rrssPercent + '%';
            document.getElementById('ecommercePercent').textContent = ecommercePercent + '%';
            document.getElementById('ecommerceFill').style.width = ecommercePercent + '%';
            document.getElementById('generalPercent').textContent = generalPercent + '%';
            document.getElementById('generalFill').style.width = generalPercent + '%';
        }

        function exportFullPDF() {
            alert('Función de PDF en desarrollo');
        }

        window.addEventListener('load', function() {
            const saved = localStorage.getItem('newpharma_user');
            if (saved) {
                document.getElementById('loginEmail').value = saved;
                login();
            }
        });
    </script>
</body>
</html>
